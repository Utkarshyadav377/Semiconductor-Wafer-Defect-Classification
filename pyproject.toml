[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-defect"
version = "0.1.0"
description = "Semiconductor wafer map defect classification (WM-811K) with a custom CNN, ResNet-18 and Grad-CAM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "pandas>=2.0",
  "scikit-learn>=1.3", "matplotlib>=3.7", "seaborn>=0.12", "pillow>=10.0", "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
